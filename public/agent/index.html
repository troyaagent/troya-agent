<body class="app desk">
<a class="skip" href="#view">Skip to content</a>

<aside class="d-side" data-side aria-label="Sidebar">

    <img src="/img/logo-3d-128.png" alt="" width="128" height="128">
    <span><b>Troya</b><i>Agent</i></span>

  <button class="d-ask-side" type="button" data-ask><span class="d-ask-ico"></span>Ask Troya<kbd>⌘K</kbd></button>

<div class="d-scrim" data-scrim hidden></div>

<div class="d-shell">

    <button class="icon-btn d-burger" type="button" aria-label="Menu" data-burger></button>

</aside>
