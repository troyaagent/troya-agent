[compiler.solc]
exclude_paths = ["script", "venv", "lib", ".venv", "node_modules"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "ds-test/=lib/openzeppelin-contracts/lib/forge-std/lib/ds-test/src/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]
evm_version = "shanghai"
via_IR = false
target_version = "0.8.24"

[compiler.solc.optimizer]
enabled = true
runs = 500

[compiler.solc.metadata]
append_CBOR = true
use_literal_content = false
bytecode_hash = "ipfs"

[detectors]
exclude = []
ignore_paths = ["venv", "test", ".venv"]
exclude_paths = ["script", "venv", "lib", ".venv", "node_modules", "test", "src/TroyaFeeSplitter.sol", "src/TroyaOathVault.sol", "src/TroyaPass.sol"]

[testing]
cmd = "anvil"

[testing.anvil]
cmd_args = "--prune-history 100 --transaction-block-keeper 10 --steps-tracing --silent"

[testing.ganache]
cmd_args = "-k istanbul -q"

[testing.hardhat]
cmd_args = ""